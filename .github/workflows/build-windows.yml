name: build-windows-exe

# main 推送也跑一遍完整打包 + 冒烟：Windows 侧的东西（装得上吗 / 包里带没带
# pywebview）在 macOS 开发机上验不了，等到打 tag 才发现问题就晚了。
# 「发布 Release」那步只在 tag 上触发（if: startsWith(github.ref, 'refs/tags/')），
# 所以 main 跑不会误发版本。
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # 先跑测试再打包：测试红了就不出 exe（`build` 里 needs: test）。
  # 跑在 **macOS** 上而不是 ubuntu：iOS 纯逻辑测试要 `swiftc`（Linux 镜像其实也带
  # swiftc，但它编不了 `import Combine` 的源码），启动页亮度要 `sips` —— 只有 macOS
  # 两样齐全，全套 368 条才真跑得起来。公共仓库的 macOS runner 不要钱。
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 测试零第三方依赖：pyvjoy / vgamepad / evdev / pystray / PIL / qrcode / zeroconf
      # 全是函数内惰性 import，import 阶段碰不到，所以这里不装任何包。
      - name: 跑测试
        run: python -m unittest discover -s tests -q

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install pyinstaller pyvjoy zeroconf qrcode pystray Pillow pywebview

      # 版本号只有一处真相源（updater.APP_VERSION）：exe 的文件属性、安装包的文件名、
      # Release 的说明全从它来。下面几步都拿这个 output 去对账。
      - name: 读版本号
        id: ver
        shell: pwsh
        run: |
          $v = python -c "import sys; sys.path.insert(0, '.'); from updater import APP_VERSION; print(APP_VERSION)"
          if (-not $v) { throw "取不到 updater.APP_VERSION" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "版本：$v"

      # tag 与 APP_VERSION 必须一致。发布用的是 tag_name，而用户机器上「检查更新」
      # 比的是 exe 自带的 APP_VERSION（updater.check_update_status）。两者错位时最坏的
      # 结果是**静默**的：exe 自报 4.0.0、Release 标签却是 v0.3.3，于是所有人算出来
      # 「最新版没我新」→ 永远显示「已是最新」→ 再也不会有人收到更新，而没人看得出来。
      # 所以宁可在这里把发版拦下来。
      - name: 校验 tag 与 APP_VERSION 一致
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v', 'V')
          $v = "${{ steps.ver.outputs.version }}"
          if ($tag -ne $v) {
            throw "tag '${{ github.ref_name }}' 与 updater.APP_VERSION '$v' 不一致。自更新是拿 Release 的 tag 与 APP_VERSION 比的，不一致会让用户静默收不到更新。请改成 v$v，或先把 APP_VERSION 提升到 $tag。"
          }
          Write-Host "tag 与 APP_VERSION 一致：v$v"

      - name: 打包 exe
        run: pyinstaller --clean --noconfirm packaging/PalmDeck.spec

      # 图标/版本资源是本机（macOS）验不了的部分 —— 只能在这里看。
      - name: 断言 exe 的图标与版本属性
        shell: pwsh
        run: |
          $info = (Get-Item dist\PalmDeck.exe).VersionInfo
          Write-Host "ProductName=$($info.ProductName)"
          Write-Host "FileDescription=$($info.FileDescription)"
          Write-Host "FileVersion=$($info.FileVersion) / ProductVersion=$($info.ProductVersion)"
          if ($info.ProductVersion -ne "${{ steps.ver.outputs.version }}") {
            throw "exe 属性里的版本是 '$($info.ProductVersion)'，期望 '${{ steps.ver.outputs.version }}' —— 版本资源配置没生效"
          }
          if (-not $info.ProductName) { throw "文件属性里 ProductName 是空的" }
          if (-not $info.FileDescription) { throw "文件属性里 FileDescription 是空的" }

      # O3-full 真窗口靠函数内惰性 `import webview` —— 冒烟测试跑无界面路径碰不到它，
      # 包漏了 pywebview 也是绿的。所以专门让 exe 自己报一声「包里有没有 pywebview」。
      - name: 断言 exe 里真的带了 pywebview（O3-full 真窗口）
        shell: pwsh
        run: |
          $out = Join-Path $env:TEMP "palmdeck-selftest.txt"
          Remove-Item $out -ErrorAction SilentlyContinue
          $env:PALMDECK_SELFTEST = $out
          Start-Process -FilePath "dist\PalmDeck.exe" -Wait
          if (-not (Test-Path $out)) {
            throw "selftest 没写出结果 —— 打包后的 exe 起不来（多半是缺模块）"
          }
          $txt = Get-Content $out -Raw
          Write-Host $txt
          if ($txt -notmatch "webview=ok") {
            throw "打包后的 exe 里没有 pywebview —— O3-full 真窗口会永远退回浏览器窗口。检查 spec 的 collect_all(\"webview\")。"
          }

      - name: 找 Inno Setup（镜像自带，缺了就装）
        id: iscc
        shell: pwsh
        run: |
          $cand = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $cand) {
            choco install innosetup -y --no-progress
            $cand = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $cand)) { throw "装完 Inno Setup 还是找不到 ISCC.exe" }
          "iscc=$cand" >> $env:GITHUB_OUTPUT
          Write-Host "ISCC：$cand"

      # WebView2 Runtime 引导器（可选）：装了才会出真窗口，没装就退回浏览器窗口。
      # 下不到不算失败 —— .iss 用 #if FileExists 兜底，安装包照编。
      - name: 准备 WebView2 Runtime 引导器
        shell: pwsh
        run: |
          $dst = "packaging\MicrosoftEdgeWebview2Setup.exe"
          try {
            Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" `
              -OutFile $dst -UseBasicParsing -TimeoutSec 120
            Write-Host ("WebView2 引导器已就绪：" + [math]::Round((Get-Item $dst).Length / 1MB, 2) + " MB")
          } catch {
            Write-Host "::warning::WebView2 引导器下载失败（$($_.Exception.Message)）；安装包不带 Runtime 兜底，缺失时运行期退回浏览器窗口"
          }

      - name: 编译安装包
        shell: pwsh
        run: |
          & "${{ steps.iscc.outputs.iscc }}" "/dAppVersion=${{ steps.ver.outputs.version }}" "packaging\PalmDeck.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC 编译失败（退出码 $LASTEXITCODE）" }
          $setup = Get-ChildItem dist\PalmDeck-Setup-*.exe -ErrorAction SilentlyContinue |
                   Select-Object -First 1
          if (-not $setup) { throw "没生成 dist\PalmDeck-Setup-*.exe" }
          Write-Host "安装包：$($setup.Name)（$([math]::Round($setup.Length / 1MB, 1)) MB）"

      # 真端到端：静默装 → 起进程 → 控制台接口有响应 → 静默卸载 → 自启项没了、配置还在。
      # 这条一次性挡住三类问题：打包缺模块、装错目录、卸载留下失效自启项（§1 里那条老缺陷）。
      - name: 静默安装冒烟测试
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = (Get-ChildItem dist\PalmDeck-Setup-*.exe | Select-Object -First 1).FullName
          $dir  = Join-Path $env:LOCALAPPDATA "Programs\PalmDeck"
          $runKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          $cfgDir = Join-Path $env:APPDATA "PalmDeck"
          function Step($m) { Write-Host $m; Write-Host "::notice::$m" }
          try {

          Write-Host "== 静默安装（带 autostart 任务，好顺带验注册表那条）=="
          Start-Process -FilePath $setup -Wait -ArgumentList `
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/NOICONS", "/TASKS=autostart"
          if (-not (Test-Path "$dir\PalmDeck.exe")) { throw "装完了 $dir 里没有 PalmDeck.exe" }
          $run = (Get-ItemProperty -Path $runKey -Name PalmDeck -ErrorAction SilentlyContinue).PalmDeck
          if (-not $run) { throw "勾了自启，但 HKCU Run 里没有 PalmDeck —— .iss 的 [Registry] 没生效" }
          Write-Host "Run 项：$run"

          Write-Host "== 启动（无托盘，不查更新）=="
          $env:PALMDECK_NO_UPDATE = "1"
          $env:PALMDECK_NO_TRAY = "1"
          $proc = Start-Process -FilePath "$dir\PalmDeck.exe" -PassThru
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 1
            if ($proc.HasExited) { throw "PalmDeck.exe 自己退出了（退出码 $($proc.ExitCode)）—— 多半是缺模块" }
            try {
              $r = Invoke-WebRequest "http://127.0.0.1:8080/api/status" -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; Write-Host "控制台响应：$($r.Content)"; break }
            } catch { }
          }
          if (-not $ok) {
            Write-Host "---- 日志尾部 ----"
            Get-Content (Join-Path $cfgDir "palmdeck.log") -Tail 40 -ErrorAction SilentlyContinue
            throw "30 秒内 http://127.0.0.1:8080/api/status 没响应"
          }
          # onefile 打包的 PyInstaller exe = 父 bootloader + 子进程，两个进程跑的是同一个
          # {app}\PalmDeck.exe。只杀 $proc.Id（父）会留下子进程继续锁着这个 exe，
          # 卸载时就删不掉它。按名字把同名进程全杀了（父 + 子）。
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Get-Process -Name PalmDeck -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

          Write-Host "== 静默卸载 =="
          $unins = Join-Path $dir "unins000.exe"
          if (-not (Test-Path $unins)) { throw "没有 unins000.exe —— 这不是个正经安装" }
          Start-Process -FilePath $unins -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          $gone = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 1
            if (-not (Test-Path "$dir\PalmDeck.exe")) { $gone = $true; break }
          }
          if (-not $gone) { throw "卸载完 $dir\PalmDeck.exe 还在" }
          $run = (Get-ItemProperty -Path $runKey -Name PalmDeck -ErrorAction SilentlyContinue).PalmDeck
          if ($run) { throw "卸载后 HKCU Run 里还留着 PalmDeck —— 开机就会报错（uninsdeletevalue 没生效）" }
          if (-not (Test-Path $cfgDir)) { throw "%APPDATA%\PalmDeck 被卸载删了 —— 布局/配置应该保留" }
          Write-Host "冒烟全绿：装得上、起得来、接口有响应、卸得干净且不丢配置"
          } catch {
            Write-Host "::error::冒烟失败：$($_.Exception.Message)"
            $log = Join-Path $cfgDir "palmdeck.log"
            if (Test-Path $log) {
              $tail = (Get-Content $log -Tail 30) -replace '%','%25'
              $tail = $tail -join '%0A'
              Write-Host "::error::日志尾部：$tail"
            }
            throw
          }

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: PalmDeck-Windows
          path: |
            dist/PalmDeck.exe
            dist/PalmDeck-Setup-*.exe
          if-no-files-found: error

      # 仅在打 tag（发版）时创建 GitHub Release。
      # exe 走 https://github.com/GITHUBA111/PalmDeck/releases/latest/download/PalmDeck.exe
      # 供 Windows 端自动更新下载 —— **这个资产名不能改**（updater.py 里写死了）。
      # 安装包是**额外**给首次安装用的，不参与自动更新。
      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/PalmDeck.exe
            dist/PalmDeck-Setup-*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
