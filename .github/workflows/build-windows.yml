name: build-windows-exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install pyinstaller vgamepad pyvjoy zeroconf qrcode

      - name: 打包
        run: pyinstaller --clean --noconfirm packaging/PalmDeck.spec

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: PalmDeck-Windows-exe
          path: dist/PalmDeck.exe
          if-no-files-found: error
